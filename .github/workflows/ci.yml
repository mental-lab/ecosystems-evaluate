name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run tests
        run: python -m unittest discover tests/ -v

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build -t ecosystems-evaluate:test .

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: ecosystems-evaluate:test
          fail-build: true
          severity-cutoff: high

  # Publish to GHCR on version tags (git tag v1.0.0 && git push --tags).
  # Uses the built-in GITHUB_TOKEN; no extra secrets needed. After the
  # first push, flip the package to public in GitHub package settings.
  publish:
    runs-on: ubuntu-latest
    needs: [test, build-and-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
