name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run tests
        run: python -m unittest discover tests/ -v

      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build container image
        id: build
        run: docker build --pull --no-cache -t ecosystems-evaluate:test .

      - name: Capture package ownership and run context
        env:
          TEST_REPOSITORY: ${{ github.repository }}
          TEST_PR: ${{ github.event.pull_request.number }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p unjam-evidence
          container_id=$(docker create ecosystems-evaluate:test)
          docker cp "$container_id:/usr/lib/apk/db/installed" unjam-evidence/installed
          docker cp "$container_id:/etc/apk/repositories" unjam-evidence/repositories
          docker rm "$container_id"
          python - <<'PYCONTEXT'
          import json, os
          from pathlib import Path
          context = {
              "repository": os.environ["TEST_REPOSITORY"],
              "pull_request": int(os.environ["TEST_PR"] or 0),
              "head_sha": os.environ["TEST_HEAD_SHA"],
              "run_id": int(os.environ["TEST_RUN_ID"]),
          }
          Path("unjam-evidence/context.json").write_text(json.dumps(context, indent=2))
          PYCONTEXT

      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ecosystems-evaluate:test
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: unjam-evidence/grype.json
          grype-version: v0.110.0

      - name: Retain Unjam test evidence
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unjam-evidence
          path: unjam-evidence/
          retention-days: 7
          if-no-files-found: error

  unjam-report:
    name: Report package blockers
    needs: build-and-scan
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out Unjam
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mental-lab/unjam
          ref: 7b0be07d606569f0b25f8e6c5e7fbfe71444e45a
          ssh-key: ${{ secrets.UNJAM_DEPLOY_KEY }}
          persist-credentials: false
          path: unjam

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Unjam
        working-directory: unjam
        run: go build -trimpath -o ../unjam-cli ./cmd/unjam

      - name: Download scan evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unjam-evidence
          path: evidence

      - name: Record package blockers
        env:
          TEST_REPOSITORY: ${{ github.repository }}
          TEST_PR: ${{ github.event.pull_request.number }}
          TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PYREPOSITORY'
          from pathlib import Path
          repositories = Path("evidence/repositories").read_text().splitlines()
          if repositories != ["https://apk.cgr.dev/chainguard"]:
              raise SystemExit("APK repository differs from this integration's configured source")
          PYREPOSITORY
          ./unjam-cli record \
            --scan evidence/grype.json --apk-db evidence/installed \
            --repository https://apk.cgr.dev/chainguard \
            --repo "$TEST_REPOSITORY" --pr "$TEST_PR" \
            --head-sha "$TEST_HEAD_SHA" --run-id "$TEST_RUN_ID" \
            --out evidence/record.json

      - name: Look up Chainguard advisories
        run: ./unjam-cli advise --record evidence/record.json --out evidence/advised-record.json

      - name: Update PR report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unjam-cli publish --record evidence/advised-record.json --bot-login 'github-actions[bot]' --enroll

  # Publish to GHCR on version tags (git tag v1.0.0 && git push --tags).
  # Uses the built-in GITHUB_TOKEN; no extra secrets needed. After the
  # first push, flip the package to public in GitHub package settings.
  publish:
    runs-on: ubuntu-latest
    needs: [test, build-and-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          # Links the GHCR package back to this repo (sidebar, README render)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
